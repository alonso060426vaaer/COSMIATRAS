<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8577f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Productividad">
<title>Control de Productividad</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="wrap">

  <header>
    <button class="volver oculto" id="btnVolver">&larr; Volver</button>
    <h1 id="titulo">Cosmiatras</h1>
    <div class="spacer"></div>
    <button class="btn btn-linea btn-sm" id="btnReporte">Reporte</button>
  </header>

  <div id="aviso" class="aviso oculto"></div>

  <!-- PANTALLA 1 : lista de cosmiatras -->
  <section id="p1">
    <div id="listaCosm" class="grid-cosm">
      <!-- las tarjetas se insertan antes de este boton -->
      <button class="tile tile-agregar" id="btnAgregar">
        <span class="tile-mas">+</span>
        <span>Agregar cosmiatra</span>
      </button>
    </div>
  </section>

  <!-- PANTALLA 2 : hoja del dia -->
  <section id="p2" class="oculto">
    <!-- paso 1: a quien va a atender -->
    <div class="card" id="cardBuscar">
      <div class="fila-paciente">
        <div class="campo-proc">
          <label>Paciente</label>
          <input id="inPaciente" placeholder="Nombre de la paciente" autocomplete="off">
        </div>
        <button class="btn btn-rosa" id="btnAtender">Atender</button>
      </div>
    </div>

    <!-- paso 2: una ficha por paciente en atencion -->
    <div id="atenciones"></div>

    <button class="btn btn-linea oculto" id="btnOtra">+ Atender otra paciente</button>

    <!-- atenciones que quedaron abiertas en dias anteriores -->
    <div class="card card-pendientes oculto" id="cardPend">
      <div class="card-titulo">
        <b>Quedaron sin cerrar</b>
        <span class="fecha">De d&iacute;as anteriores</span>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Paciente</th><th>Procedimiento</th><th>Inicio</th><th></th></tr></thead>
        <tbody id="tbPend"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-titulo">
        <b>Hoy</b><span class="fecha" id="fechaHoy"></span><span class="fecha" id="estadoEnvio"></span>
      </div>
      <table>
        <thead><tr><th>Paciente</th><th>Procedimiento</th><th>Inicio</th><th>T&eacute;rmino</th><th></th></tr></thead>
        <tbody id="tbHoy"></tbody>
      </table>
      <div class="vacio oculto" id="vacioHoy">Sin atenciones todav&iacute;a</div>
    </div>
  </section>

  <!-- PANTALLA 3 : reporte -->
  <section id="p3" class="oculto">
    <div class="card">
      <div class="fila-form">
        <div>
          <label>Fecha</label>
          <input type="date" id="fFecha">
        </div>
        <div>
          <label>Cosmiatra</label>
          <select id="fCosm"></select>
        </div>
        <button class="btn btn-linea" id="btnExcel">Enviar a la hoja</button>
        <button class="btn btn-linea btn-sm" id="btnCSV">Descargar CSV</button>
      </div>
    </div>

    <div class="card">
      <div class="totales">
        <div><b id="tPac">0</b><span>Pacientes</span></div>
        <div><b id="tAt">0</b><span>Procedimientos</span></div>
        <div><b id="tMin">0</b><span>Minutos</span></div>
      </div>
      <div class="vacio oculto" id="vacioRep">Sin registros</div>
    </div>

    <!-- una tarjeta por persona, para no mezclar sus procedimientos -->
    <div id="repPorPersona"></div>
  </section>

</div>

<script src="procedimientos.js"></script>
<script>
/* ============================================================
   Cada registro = UN procedimiento con su propio cronometro.
   Una paciente puede tener varios registros el mismo dia.
   ============================================================ */

/* ---------- datos ---------- */
var DB = {
  cosmiatras: JSON.parse(localStorage.getItem('cosmiatras') || '["Denisse","Pamela","Karen"]'),
  registros:  JSON.parse(localStorage.getItem('registros')  || '[]'),
  /* pacientes que cada cosmiatra tiene abiertas ahora mismo */
  abiertas:   JSON.parse(localStorage.getItem('abiertas')   || '{}')
};

function guardar(){
  localStorage.setItem('cosmiatras', JSON.stringify(DB.cosmiatras));
  localStorage.setItem('registros',  JSON.stringify(DB.registros));
  localStorage.setItem('abiertas',   JSON.stringify(DB.abiertas));
}

/* Identificador propio de cada registro. Se usa en vez de la posicion
   dentro del arreglo, que cambia al borrar. */
var contadorId = 0;
function nuevoId(){
  return Date.now().toString(36) + '-' + (contadorId++);
}
function porId(id){
  for(var i = 0; i < DB.registros.length; i++){
    if(DB.registros[i].id === id) return DB.registros[i];
  }
  return null;
}

/* Version anterior: un registro traia proc1/proc2/proc3 juntos.
   Ahora cada procedimiento vive en su propio registro. */
function migrar(){
  var salida = [], cambio = false;
  DB.registros.forEach(function(r){
    if(r.proc1 === undefined && r.proc2 === undefined && r.proc3 === undefined){
      salida.push(r);
      return;
    }
    cambio = true;
    [r.proc1, r.proc2, r.proc3].forEach(function(p, k){
      if(!p && k > 0) return;
      salida.push({
        cosmiatra: r.cosmiatra, fecha: r.fecha, paciente: r.paciente,
        procedimiento: p || '', inicio: r.inicio, fin: r.fin
      });
    });
  });
  salida.forEach(function(r){
    if(!r.id){ r.id = nuevoId(); cambio = true; }
  });
  if(cambio){ DB.registros = salida; guardar(); }
}
migrar();

/* Los dos doctores tienen su propia pestana en la hoja de calculo.
   Se agregan una sola vez: si luego los borras de la lista, no vuelven. */
if(!localStorage.getItem('doctoresAgregados')){
  ['Dra. Estefany', 'Dr. Gustavo'].forEach(function(n){
    var existe = DB.cosmiatras.some(function(c){ return c.toLowerCase() === n.toLowerCase(); });
    if(!existe) DB.cosmiatras.push(n);
  });
  localStorage.setItem('doctoresAgregados', '1');
  guardar();
}

/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }

function hoy(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function ahora(){
  var d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function minutos(a,b){
  if(!a || !b) return '';
  var x = a.split(':'), y = b.split(':');
  return (y[0]*60 + +y[1]) - (x[0]*60 + +x[1]);
}
function fechaLarga(f){
  var p = f.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function limpio(t){
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var cosmActual = null;

/* Si se entra al reporte desde la hoja de una persona, se ve solo lo
   suyo. Desde la lista general se ve todo. */
var reporteDe = null;

function aviso(txt){
  var a = $('aviso');
  a.textContent = txt;
  a.classList.remove('oculto');
  clearTimeout(aviso.t);
  aviso.t = setTimeout(function(){ a.classList.add('oculto'); }, 3000);
}

function pantalla(n){
  $('aviso').classList.add('oculto');
  ['p1','p2','p3'].forEach(function(p,i){ $(p).classList.toggle('oculto', i !== n-1); });
  $('btnVolver').classList.toggle('oculto', n === 1);
  $('btnReporte').classList.toggle('oculto', n === 3);
  $('titulo').textContent = n === 1 ? 'Cosmiatras'
                          : (n === 2 ? cosmActual
                          : (reporteDe ? 'Reporte de ' + reporteDe : 'Reporte'));
}

/* ---------- pantalla 1 : lista de cosmiatras ---------- */

/* Iniciales para el circulo de la tarjeta */
function iniciales(nombre){
  var p = nombre.trim().split(/\s+/);
  return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase();
}

/* Color estable por nombre, para reconocerlas de un vistazo */
var TONOS = ['#b8577f','#8d6ea8','#c07a52','#4f9d8b','#a8556b','#6f83b5','#b0824a','#5f9ab8'];
function tono(nombre){
  var s = 0;
  for(var i = 0; i < nombre.length; i++) s += nombre.charCodeAt(i);
  return TONOS[s % TONOS.length];
}

function pintarCosmiatras(){
  var cont = $('listaCosm'), mas = $('btnAgregar');

  /* se borran solo las tarjetas: el boton de agregar es fijo */
  Array.prototype.slice.call(cont.querySelectorAll('.cosm')).forEach(function(n){
    cont.removeChild(n);
  });

  DB.cosmiatras.forEach(function(nombre){
    var enCurso = DB.registros.filter(function(r){ return r.cosmiatra === nombre && !r.fin; }).length;

    var div = document.createElement('div');
    div.className = 'tile cosm';
    div.innerHTML =
      '<span class="x" title="Eliminar">&times;</span>' +
      '<span class="avatar" style="background:' + tono(nombre) + '">' + limpio(iniciales(nombre)) + '</span>' +
      '<span class="nombre">' + limpio(nombre) + '</span>' +
      (enCurso
        ? '<span class="pill pill-curso">' + (enCurso > 1 ? enCurso + ' en curso' : 'En curso') + '</span>'
        : '<span class="pill pill-libre">Disponible</span>');

    div.onclick = function(){ abrirHoja(nombre); };
    div.querySelector('.x').onclick = function(e){
      e.stopPropagation();
      if(confirm('Eliminar a ' + nombre + ' de la lista?')){
        DB.cosmiatras = DB.cosmiatras.filter(function(c){ return c !== nombre; });
        guardar();
        pintarCosmiatras();
      }
    };
    cont.insertBefore(div, mas);
  });
}

$('btnAgregar').onclick = function(){
  var n = (prompt('Nombre de la cosmiatra') || '').trim();
  if(!n) return;
  if(DB.cosmiatras.some(function(c){ return c.toLowerCase() === n.toLowerCase(); })){
    return aviso('Ese nombre ya existe');
  }
  DB.cosmiatras.push(n);
  guardar();
  pintarCosmiatras();
};

/* ============================================================
   PANTALLA 2 : hoja del dia
   ------------------------------------------------------------
   "filas" son los renglones del formulario de la paciente actual.
     id === null  -> el procedimiento todavia no arranca
     id           -> identificador de su registro en DB.registros
   ============================================================ */
/* Una cosmiatra puede tener VARIAS pacientes abiertas a la vez.

   atenciones = [ { paciente, fecha, filas: [ {texto, id} ] } ]
       id === null  -> ese procedimiento todavia no arranca
       id           -> identificador de su registro en DB.registros

   Se guardan en el navegador: si recarga la pagina o se le bloquea el
   telefono, sus pacientes siguen abiertas donde las dejo. */
var atenciones   = [];
var pidiendoOtra = false;   /* esta escribiendo el nombre de otra paciente */

function filaVacia(){ return { texto:'', id:null }; }

function abrirHoja(nombre){
  cosmActual = nombre;

  /* las fichas que dejo abiertas otro dia no se arrastran. Si algo
     quedo en marcha, aparece abajo en "Quedaron sin cerrar". */
  atenciones = (DB.abiertas[nombre] || []).filter(function(a){ return a.fecha === hoy(); });
  pidiendoOtra = false;

  $('fechaHoy').textContent = fechaLarga(hoy());
  pantalla(2);
  pintarAtenciones();
  pintarHoja();
  pintarPendientes();
  guardarAbiertas();

  if(!atenciones.length) $('inPaciente').focus();
}

function guardarAbiertas(){
  if(cosmActual) DB.abiertas[cosmActual] = atenciones;
  guardar();
}

/* Abre la ficha de una paciente: aparece su tarjeta con el primer
   procedimiento listo para escribir. */
function atenderPaciente(){
  if(Date.now() - ultimaEleccion < 600) return;   /* clic fantasma del tactil */

  var nombre = $('inPaciente').value.trim();
  if(!nombre) return aviso('Escribe el nombre de la paciente');

  for(var k = 0; k < atenciones.length; k++){
    if(atenciones[k].paciente.toLowerCase() === nombre.toLowerCase()){
      pidiendoOtra = false;
      pintarAtenciones();
      return aviso('A ' + atenciones[k].paciente + ' ya la estas atendiendo');
    }
  }

  atenciones.push({ paciente: nombre, fecha: hoy(), filas: [filaVacia()] });
  pidiendoOtra = false;
  guardarAbiertas();
  pintarAtenciones();

  var libre = document.querySelector('#atenciones input:not([disabled])');
  if(libre) libre.focus();
}

/* Cierra la ficha. Solo si no le queda nada en curso, para que no se
   pierda un cronometro andando. */
function cerrarAtencion(k){
  var a = atenciones[k];
  if(!a) return;

  var enCurso = a.filas.some(function(f){
    var r = f.id === null ? null : porId(f.id);
    return r && !r.fin;
  });
  if(enCurso) return aviso('Termina o cancela lo que tiene en curso antes de cerrar');

  atenciones.splice(k, 1);
  if(!atenciones.length) pidiendoOtra = false;
  guardarAbiertas();
  pintarAtenciones();
}

function refrescar(){
  guardarAbiertas();
  pintarAtenciones();
  pintarHoja();
  pintarPendientes();
  enviarPendientes();
}

/* ---------- las fichas abiertas ---------- */
function pintarAtenciones(){
  var cont = $('atenciones');
  cont.innerHTML = '';
  atenciones.forEach(function(a, k){ cont.appendChild(tarjetaAtencion(a, k)); });

  /* el buscador se ve cuando no hay nadie abierto, o cuando ella
     pidio atender a otra */
  var buscando = (atenciones.length === 0) || pidiendoOtra;
  $('cardBuscar').classList.toggle('oculto', !buscando);
  $('btnOtra').classList.toggle('oculto', buscando);
  if(buscando) $('inPaciente').value = '';
}

/* Cuenta como esta la ficha: cuantos corriendo y cuantos terminados. */
function estadoFicha(a){
  var e = { enCurso: 0, hechos: 0, libres: 0 };
  a.filas.forEach(function(f){
    var r = f.id === null ? null : porId(f.id);
    if(!r)            e.libres++;
    else if(!r.fin)   e.enCurso++;
    else              e.hechos++;
  });
  return e;
}

function tarjetaAtencion(a, k){
  var e = estadoFicha(a);

  var card = document.createElement('div');
  card.className = 'card card-atencion' + (a.plegada ? ' plegada' : '');

  var tit = document.createElement('div');
  tit.className = 'card-titulo';

  var nom = document.createElement('b');
  nom.textContent = a.paciente;
  tit.appendChild(nom);

  /* ---- plegada: una sola linea, se toca para volver a abrirla.
     Para terminar los procedimientos estan los botones de la tabla
     de Hoy, asi que aqui no hace falta verlos otra vez. ---- */
  if(a.plegada){
    var partes = [];
    if(e.enCurso) partes.push(e.enCurso + ' en curso');
    if(e.hechos)  partes.push(e.hechos + (e.hechos === 1 ? ' terminado' : ' terminados'));

    var res = document.createElement('span');
    res.className = 'fecha resumen-ficha';
    res.textContent = (partes.join(' \u00b7 ') || 'sin procedimientos') + '  \u25be';
    tit.appendChild(res);

    tit.classList.add('plegable');
    tit.onclick = function(){ a.plegada = false; guardarAbiertas(); pintarAtenciones(); };
    card.appendChild(tit);
    return card;
  }

  /* ---- abierta ---- */
  var acciones = document.createElement('div');
  acciones.className = 'acciones-ficha';

  if(e.enCurso + e.hechos > 0){
    var ocultar = document.createElement('button');
    ocultar.className = 'btn btn-linea btn-sm';
    ocultar.textContent = 'Ocultar';
    ocultar.onclick = function(){ a.plegada = true; guardarAbiertas(); pintarAtenciones(); };
    acciones.appendChild(ocultar);
  }

  var cerrar = document.createElement('button');
  cerrar.className = 'btn btn-linea btn-sm';
  cerrar.textContent = 'Cerrar ficha';
  cerrar.onclick = function(){ cerrarAtencion(k); };
  acciones.appendChild(cerrar);

  tit.appendChild(acciones);
  card.appendChild(tit);

  a.filas.forEach(function(f, i){ card.appendChild(filaProcDOM(a, k, f, i)); });

  var mas = document.createElement('button');
  mas.className = 'btn btn-linea btn-sm';
  mas.textContent = '+ Agregar procedimiento';
  mas.onclick = function(){
    a.filas.push(filaVacia());
    guardarAbiertas();
    pintarAtenciones();
    var t = $('atenciones').children[k];
    if(t){
      var libres = t.querySelectorAll('input:not([disabled])');
      if(libres.length) libres[libres.length - 1].focus();
    }
  };
  card.appendChild(mas);

  return card;
}

/* ============================================================
   AUTOCOMPLETADO DE PROCEDIMIENTOS
   ------------------------------------------------------------
   Se escriben las primeras letras y aparecen los que coinciden.
   Se toca uno y queda puesto. Igual se puede escribir algo que
   no este en la lista: la lista sugiere, no obliga.
   La lista vive en procedimientos.js.
   ============================================================ */

var MAX_SUGERENCIAS = 8;

/* Momento en que se eligio una sugerencia. Sirve de red de seguridad:
   si justo despues llega un clic al boton Iniciar, es el clic fantasma
   del tactil y no una persona pulsandolo. */
var ultimaEleccion = 0;

/* compara sin tildes ni mayusculas: "lampara" encuentra "Lampara LED" */
function sinTildes(t){
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/* Los tratamientos corporales se hacen por zona. Si ya escribio uno
   de ellos y un espacio, se le ofrecen las zonas ya pegadas:
   "Emsculpt " -> "Emsculpt abdomen", "Emsculpt cintura"...
   Asi no hace falta tener las 264 combinaciones en la lista. */
function sugerirZonas(texto){
  if(typeof POR_ZONA === 'undefined' || typeof ZONAS === 'undefined') return [];

  var t = String(texto).replace(/\s+/g, ' ');
  var corte = t.lastIndexOf(' ');
  if(corte < 1) return [];

  var base  = sinTildes(t.slice(0, corte).trim());
  var resto = sinTildes(t.slice(corte + 1));

  var servicio = null;
  for(var k = 0; k < POR_ZONA.length; k++){
    if(sinTildes(POR_ZONA[k]) === base){ servicio = POR_ZONA[k]; break; }
  }
  if(!servicio) return [];

  var salida = [];
  for(var z = 0; z < ZONAS.length; z++){
    if(resto && sinTildes(ZONAS[z]).indexOf(resto) !== 0) continue;
    salida.push(servicio + ' ' + ZONAS[z]);
  }
  return salida;
}

function buscarProcs(texto){
  if(typeof PROCEDIMIENTOS === 'undefined') return [];

  var q        = sinTildes(texto).trim();
  var tal_cual = String(texto).trim();

  /* las zonas van primero: si escribio "Emsculpt " es lo que busca */
  var zonas = sugerirZonas(texto).filter(function(p){ return p !== tal_cual; });
  if(q.length < 2) return zonas.slice(0, MAX_SUGERENCIAS);

  /* despues los que empiezan igual, y al final los que lo llevan dentro */
  var empiezan = [], dentro = [];
  for(var k = 0; k < PROCEDIMIENTOS.length; k++){
    var p = PROCEDIMIENTOS[k], sp = sinTildes(p);
    /* solo se salta si ya lo escribio identico. Si coincide pero con
       otras mayusculas o sin tildes, se ofrece igual: asi "4rf" propone
       "4RF" y todas terminan escribiendolo de la misma forma. */
    if(p === tal_cual) continue;
    var pos = sp.indexOf(q);
    if(pos === 0) empiezan.push(p);
    else if(pos > 0) dentro.push(p);
  }
  return zonas.concat(empiezan, dentro).slice(0, MAX_SUGERENCIAS);
}

/* La misma caja sirve para procedimientos y para pacientes:
     buscar  -> funcion que devuelve la lista de coincidencias
     alEnter -> que hacer con Enter cuando no hay nada marcado
                (en procedimientos no se pasa nada: Enter solo cierra,
                 para que el cronometro arranque unicamente con el boton) */
/* Pacientes que ya se atendieron antes, de la mas reciente a la mas
   antigua, para no volver a escribir el nombre entero cada vez. */
function buscarPacientes(texto){
  var q = sinTildes(texto).trim();
  if(q.length < 2) return [];

  var tal_cual = String(texto).trim();
  var vistos = {}, salida = [];

  for(var k = DB.registros.length - 1; k >= 0; k--){
    var p = String(DB.registros[k].paciente || '').trim();
    if(!p) continue;

    var clave = p.toLowerCase();
    if(vistos[clave]) continue;
    if(sinTildes(p).indexOf(q) < 0) continue;
    if(p === tal_cual) continue;          /* ya lo escribio identico */

    vistos[clave] = true;
    salida.push(p);
    if(salida.length >= MAX_SUGERENCIAS) break;
  }
  return salida;
}

function cajaSugerencias(inp, buscar, alEnter){
  var caja = document.createElement('div');
  caja.className = 'sugerencias oculto';
  var opciones = [], activa = -1;

  function cerrar(){
    caja.classList.add('oculto');
    caja.innerHTML = '';
    opciones = [];
    activa = -1;
  }

  function marcar(n){
    if(!opciones.length) return;
    if(activa >= 0) opciones[activa].classList.remove('sel');
    activa = (n + opciones.length) % opciones.length;
    opciones[activa].classList.add('sel');
    opciones[activa].scrollIntoView({ block: 'nearest' });
  }

  function elegir(texto){
    inp.value = texto;
    inp.oninput();          /* para que se guarde en la fila */
    ultimaEleccion = Date.now();
    cerrar();
    inp.focus();
  }

  function pintar(){
    var lista = buscar(inp.value);
    caja.innerHTML = '';
    opciones = [];
    activa = -1;
    if(!lista.length){ cerrar(); return; }
    lista.forEach(function(p){
      var op = document.createElement('div');
      op.textContent = p;
      /* En el telefono la lista tapa el boton Iniciar. Si se cerrara
         al tocar, el clic que llega despues aterrizaria en el boton y
         arrancaria el cronometro solo. Por eso:
           - pointerdown: solo evita que el campo pierda el foco, para
             que la lista siga abierta cuando llegue el clic;
           - click: elige y cierra. El clic se lo come esta opcion y
             nunca llega a lo que hay debajo. */
      op.addEventListener('pointerdown', function(ev){ ev.preventDefault(); });
      op.addEventListener('click', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        elegir(p);
      });
      caja.appendChild(op);
      opciones.push(op);
    });
    caja.classList.remove('oculto');
  }

  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', pintar);
  inp.addEventListener('blur', function(){ setTimeout(cerrar, 150); });

  inp.onkeydown = function(e){
    var abierta = !caja.classList.contains('oculto') && opciones.length > 0;
    if(abierta && e.key === 'ArrowDown'){ e.preventDefault(); marcar(activa + 1); return; }
    if(abierta && e.key === 'ArrowUp'){   e.preventDefault(); marcar(activa - 1); return; }
    if(abierta && e.key === 'Escape'){    cerrar(); return; }
    if(e.key === 'Enter'){
      /* Enter solo elige de la lista o la cierra. El cronometro
         arranca UNICAMENTE con el boton Iniciar, para que no se
         dispare sin querer con el teclado del telefono. */
      e.preventDefault();
      if(abierta && activa >= 0){ elegir(opciones[activa].textContent); return; }
      cerrar();
      if(alEnter) alEnter();
    }
  };

  return caja;
}

function filaProcDOM(a, k, f, i){
  var reg = f.id === null ? null : porId(f.id);

  var row = document.createElement('div');
  row.className = 'fila-proc';
  if(reg && !reg.fin) row.classList.add('en-marcha');

  /* campo de texto */
  var campo = document.createElement('div');
  campo.className = 'campo-proc';
  var lab = document.createElement('label');
  lab.textContent = 'Procedimiento ' + (i + 1);
  var inp = document.createElement('input');
  inp.value = f.texto;
  inp.placeholder = 'Tratamiento';
  inp.autocomplete = 'off';
  inp.disabled = !!reg;
  inp.oninput = function(){ f.texto = inp.value; };
  campo.appendChild(lab);
  campo.appendChild(inp);
  /* mientras no haya arrancado, sugiere procedimientos al escribir */
  if(!reg) campo.appendChild(cajaSugerencias(inp, buscarProcs));

  /* estado / duracion */
  var estado = document.createElement('div');
  estado.className = 'estado';
  if(reg && !reg.fin){
    estado.classList.add('curso');
    estado.textContent = 'En curso desde ' + reg.inicio;
  } else if(reg){
    estado.textContent = reg.inicio + ' a ' + reg.fin + '  ·  ' + minutos(reg.inicio, reg.fin) + ' min';
  }

  /* boton principal: Iniciar -> Terminar -> Listo */
  var btn = document.createElement('button');
  btn.className = 'btn btn-sm';
  if(!reg){
    btn.className += ' btn-rosa';
    btn.innerHTML = '&#9654; Iniciar';
    btn.onclick = function(){ iniciarFila(k, i); };
  } else if(!reg.fin){
    btn.className += ' btn-verde';
    btn.innerHTML = '&#9632; Terminar';
    btn.onclick = function(){ terminarFila(k, i); };
  } else {
    btn.className += ' btn-listo';
    btn.textContent = 'Listo';
    btn.disabled = true;
  }

  /* La X cambia segun el momento: quita el renglon si todavia no
     arranco, y cancela el procedimiento si ya esta en marcha. */
  var quitar = document.createElement('button');
  quitar.className = 'quitar';
  quitar.innerHTML = '&times;';

  if(reg && !reg.fin){
    quitar.classList.add('cancelar');
    quitar.title = 'Cancelar este procedimiento';
    quitar.onclick = function(){ cancelarRegistro(reg); };
  } else if(reg){
    quitar.classList.add('invisible');          /* ya termino: no se cancela */
  } else {
    quitar.title = 'Quitar este renglon';
    quitar.onclick = function(){ a.filas.splice(i, 1); guardarAbiertas(); pintarAtenciones(); };
    if(a.filas.length <= 1) quitar.classList.add('invisible');
  }

  row.appendChild(campo);
  row.appendChild(estado);
  row.appendChild(btn);
  row.appendChild(quitar);
  return row;
}

function iniciarFila(k, i){
  /* si se acaba de elegir del autocompletado, esto es el clic fantasma
     que el tactil manda sobre lo que habia debajo de la lista */
  if(Date.now() - ultimaEleccion < 600) return;

  var a = atenciones[k];
  if(!a) return;
  var f = a.filas[i];
  if(!f || f.id !== null) return;

  var pac = a.paciente;
  var txt = (f.texto || '').trim();
  if(!txt) return aviso('Escribe el procedimiento ' + (i + 1));

  var reg = {
    id: nuevoId(),
    cosmiatra: cosmActual,
    fecha: hoy(),
    paciente: pac,
    procedimiento: txt,
    inicio: ahora(),
    fin: ''
  };
  DB.registros.push(reg);
  f.id = reg.id;

  /* si ya no queda ningun renglon por escribir, la ficha se pliega
     sola: lo que sigue es terminar, y eso se hace desde la tabla
     de Hoy, que esta justo debajo */
  if(!a.filas.some(function(x){ return x.id === null; })) a.plegada = true;

  refrescar();
}

/* Cancela un procedimiento que se inicio por error: borra el registro
   y apaga el cronometro. Solo mientras esta en marcha; si ya termino
   se fue a la hoja y no se toca desde aqui. */
function cancelarRegistro(reg){
  if(!reg || reg.fin) return;
  if(!confirm('Cancelar "' + reg.procedimiento + '"?\n\nSe borra el registro y el cronometro.')) return;

  DB.registros = DB.registros.filter(function(x){ return x.id !== reg.id; });
  atenciones.forEach(function(a){
    a.filas.forEach(function(f){ if(f.id === reg.id) f.id = null; });
  });
  refrescar();
  aviso('Procedimiento cancelado');
}

function terminarFila(k, i){
  var a = atenciones[k];
  if(!a || !a.filas[i]) return;
  var reg = a.filas[i].id === null ? null : porId(a.filas[i].id);
  if(!reg) return;
  reg.fin = ahora();
  refrescar();
}

$('btnAtender').onclick = atenderPaciente;

$('btnOtra').onclick = function(){
  pidiendoOtra = true;
  pintarAtenciones();
  $('inPaciente').focus();
};

/* El campo de la paciente tambien sugiere, con los nombres que ya
   se atendieron antes. Enter busca, igual que el boton. */
$('inPaciente').parentElement.appendChild(

);

/* ---------- tabla del dia ----------
   Solo muestra la fecha de hoy: manana la hoja aparece limpia,
   pero los registros viejos siguen guardados para el reporte. */
function pintarHoja(){
  var f = hoy();
  var lista = DB.registros.filter(function(r){
    return r.cosmiatra === cosmActual && r.fecha === f;
  });

  var tb = $('tbHoy');
  tb.innerHTML = '';
  $('vacioHoy').classList.toggle('oculto', lista.length > 0);

  lista.forEach(function(r){
    var tr = document.createElement('tr');
    if(!r.fin) tr.className = 'activa';

    /* en el telefono las tres columnas de tiempo se juntan en una
       sola linea, que ocupa mucho menos */
    var horario = r.fin
      ? r.inicio + ' \u2013 ' + r.fin + '  \u00b7  ' + minutos(r.inicio, r.fin) + ' min'
      : 'desde ' + r.inicio;

    tr.innerHTML =
      '<td class="col-paciente" data-tit="Paciente">' + limpio(r.paciente) + '</td>' +
      '<td data-tit="Procedimiento">' + limpio(r.procedimiento) + '</td>' +
      '<td class="solo-escritorio" data-tit="Inicio">' + r.inicio + '</td>' +
      '<td class="solo-escritorio" data-tit="T&eacute;rmino">' + (r.fin || '&mdash;') + '</td>' +
      '<td class="solo-movil horario">' + horario + '</td>' +
      '<td class="acciones"></td>';

    var celda = tr.lastChild;
    if(!r.fin){
      var b = document.createElement('button');
      b.className = 'btn btn-verde btn-sm';
      b.innerHTML = '&#9632; Terminar';
      b.onclick = function(){ r.fin = ahora(); refrescar(); };
      celda.appendChild(b);

      /* por si lo inicio por error */
      var x = document.createElement('button');
      x.className = 'quitar cancelar';
      x.innerHTML = '&times;';
      x.title = 'Cancelar este procedimiento';
      x.onclick = function(){ cancelarRegistro(r); };
      celda.appendChild(x);
    } else {
      celda.setAttribute('data-tit', 'Duración');
      celda.innerHTML = '<span class="duracion">' + minutos(r.inicio, r.fin) + ' min</span>';
    }
    tb.appendChild(tr);
  });
}

/* ---------- pendientes de dias anteriores ----------
   Atenciones que se iniciaron y nunca se cerraron. Como la hoja solo
   muestra el dia de hoy, se rescatan aqui para poder cerrarlas. */
function pintarPendientes(){
  var f = hoy();
  var lista = DB.registros.filter(function(r){
    return r.cosmiatra === cosmActual && !r.fin && r.fecha !== f;
  });

  $('cardPend').classList.toggle('oculto', lista.length === 0);
  var tb = $('tbPend');
  tb.innerHTML = '';

  lista.forEach(function(r){
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td data-tit="Fecha">' + fechaLarga(r.fecha) + '</td>' +
      '<td class="col-paciente" data-tit="Paciente">' + limpio(r.paciente) + '</td>' +
      '<td data-tit="Procedimiento">' + limpio(r.procedimiento) + '</td>' +
      '<td data-tit="Inicio">' + r.inicio + '</td>' +
      '<td class="acciones"></td>';

    var celda = tr.lastChild;

    var cerrar = document.createElement('button');
    cerrar.className = 'btn btn-verde btn-sm';
    cerrar.textContent = 'Poner hora';
    cerrar.onclick = function(){ cerrarPendiente(r); };
    celda.appendChild(cerrar);

    var borrar = document.createElement('button');
    borrar.className = 'quitar';
    borrar.innerHTML = '&times;';
    borrar.title = 'Eliminar este registro';
    borrar.onclick = function(){
      if(!confirm('Eliminar el registro de ' + r.paciente + ' del ' + fechaLarga(r.fecha) + '?')) return;
      DB.registros = DB.registros.filter(function(x){ return x.id !== r.id; });
      refrescar();
    };
    celda.appendChild(borrar);

    tb.appendChild(tr);
  });
}

function cerrarPendiente(r){
  var h = prompt('Hora de termino de "' + r.procedimiento + '" (HH:MM)', r.inicio);
  if(h === null) return;
  h = h.trim();
  var p = /^([01]?[0-9]|2[0-3]):([0-5][0-9])$/.exec(h);
  if(!p) return aviso('Hora invalida. Usa el formato HH:MM, por ejemplo 15:30');
  var fin = p[1].padStart(2,'0') + ':' + p[2];
  if(minutos(r.inicio, fin) < 0) return aviso('La hora de termino es anterior a la de inicio');
  r.fin = fin;
  refrescar();
}

/* Si la pagina se queda abierta y pasa la medianoche, la hoja se limpia sola. */
var diaVista = hoy();
setInterval(function(){
  if(hoy() === diaVista) return;
  diaVista = hoy();
  if($('p2').classList.contains('oculto')) return;
  /* las fichas de ayer se recogen; lo que quedo en marcha reaparece
     abajo en "Quedaron sin cerrar" */
  atenciones = atenciones.filter(function(a){ return a.fecha === hoy(); });
  pidiendoOtra = false;
  guardarAbiertas();
  pintarAtenciones();
  $('fechaHoy').textContent = fechaLarga(diaVista);
  pintarHoja();
  pintarPendientes();
  aviso('Cambio de dia: la hoja empieza limpia');
}, 30000);

/* ---------- pantalla 3 : reporte ---------- */
function abrirReporte(){
  /* si venimos de la hoja de alguien, el reporte es de esa persona */
  reporteDe = cosmActual;

  var sel = $('fCosm');
  sel.innerHTML = '<option value="">Todas</option>';
  DB.cosmiatras.forEach(function(c){
    var o = document.createElement('option');
    o.textContent = c;
    sel.appendChild(o);
  });

  if(reporteDe){
    /* solo lo suyo, y sin poder cambiar a otra persona */
    sel.value = reporteDe;
    sel.disabled = true;
  } else {
    /* desde la lista general se empieza viendo a todas, sin arrastrar
       el filtro que quedo del reporte personal anterior */
    sel.value = '';
    sel.disabled = false;
  }

  if(!$('fFecha').value) $('fFecha').value = hoy();
  pantalla(3);
  pintarReporte();
}

function filtrados(){
  var f = $('fFecha').value, c = $('fCosm').value;
  return DB.registros.filter(function(r){
    return (!f || r.fecha === f) && (!c || r.cosmiatra === c);
  });
}

function pintarReporte(){
  var datos = filtrados();
  var cont = $('repPorPersona');
  cont.innerHTML = '';
  $('vacioRep').classList.toggle('oculto', datos.length > 0);

  /* totales de arriba: el conjunto de lo filtrado */
  var tot = 0, pacientes = {};
  datos.forEach(function(r){
    var m = minutos(r.inicio, r.fin);
    if(m) tot += m;
    pacientes[r.fecha + '|' + r.cosmiatra + '|' + r.paciente] = 1;
  });
  $('tPac').textContent = Object.keys(pacientes).length;
  $('tAt').textContent  = datos.length;
  $('tMin').textContent = tot;

  /* y debajo, una tarjeta por persona: cada quien con lo suyo */
  var porPersona = {}, nombres = [];
  datos.forEach(function(r){
    if(!porPersona[r.cosmiatra]){ porPersona[r.cosmiatra] = []; nombres.push(r.cosmiatra); }
    porPersona[r.cosmiatra].push(r);
  });
  nombres.sort(function(a, b){ return a.localeCompare(b); });
  nombres.forEach(function(n){ cont.appendChild(tarjetaPersona(n, porPersona[n])); });
}

/* Tarjeta con los procedimientos de una sola persona. No lleva
   columna de cosmiatra: el nombre ya esta en el titulo. */
function tarjetaPersona(nombre, lista){
  lista = lista.slice().sort(function(a, b){
    return (a.fecha + a.inicio).localeCompare(b.fecha + b.inicio);
  });

  var min = 0, pac = {};
  lista.forEach(function(r){
    var m = minutos(r.inicio, r.fin);
    if(m) min += m;
    pac[r.fecha + '|' + r.paciente] = 1;
  });

  var filas = lista.map(function(r){
    var m = minutos(r.inicio, r.fin);
    return '<tr>' +
      '<td data-tit="Fecha">' + fechaLarga(r.fecha) + '</td>' +
      '<td class="col-paciente" data-tit="Paciente">' + limpio(r.paciente) + '</td>' +
      '<td data-tit="Procedimiento">' + limpio(r.procedimiento) + '</td>' +
      '<td data-tit="Inicio">' + r.inicio + '</td>' +
      '<td data-tit="T&eacute;rmino">' + (r.fin || '&mdash;') + '</td>' +
      '<td data-tit="Minutos">' + (m === '' ? '&mdash;' : m) + '</td></tr>';
  }).join('');

  var nPac = Object.keys(pac).length;
  var resumen = nPac + (nPac === 1 ? ' paciente' : ' pacientes') +
                ' &middot; ' + lista.length + (lista.length === 1 ? ' procedimiento' : ' procedimientos') +
                ' &middot; ' + min + ' min';

  var div = document.createElement('div');
  div.className = 'card';
  div.innerHTML =
    '<div class="card-titulo"><b>' + limpio(nombre) + '</b>' +
    '<span class="fecha">' + resumen + '</span></div>' +
    '<table><thead><tr><th>Fecha</th><th>Paciente</th><th>Procedimiento</th>' +
    '<th>Inicio</th><th>T&eacute;rmino</th><th>Min</th></tr></thead>' +
    '<tbody>' + filas + '</tbody></table>';
  return div;
}

$('fFecha').onchange = pintarReporte;
$('fCosm').onchange  = pintarReporte;

$('btnExcel').onclick = enviarFiltrados;

$('btnCSV').onclick = function(){
  var datos = filtrados();
  if(!datos.length) return aviso('No hay registros para exportar');
  var salto = String.fromCharCode(10);
  var csv = 'Fecha;Cosmiatra;Paciente;Procedimiento;Hora inicio;Hora termino;Minutos' + salto;
  datos.forEach(function(r){
    csv += [fechaLarga(r.fecha), r.cosmiatra, r.paciente, r.procedimiento,
            r.inicio, r.fin, minutos(r.inicio, r.fin)].join(';') + salto;
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([String.fromCharCode(65279) + csv], { type:'text/csv;charset=utf-8' }));
  a.download = 'productividad_' + ($('fFecha').value || 'todo') + '.csv';
  a.click();
};

/* ============================================================
   ENVIO A GOOGLE SHEETS
   ------------------------------------------------------------
   Cada procedimiento TERMINADO se manda como una fila, con el
   mismo orden de columnas que ya tiene la hoja. Si no hay
   internet queda pendiente y se reintenta solo: al terminar el
   siguiente procedimiento o al abrir la pagina.
   ============================================================ */

var SHEETS_URL   = 'https://script.google.com/macros/s/AKfycbyz51f-bY6Mo3f0KiCjqgH-F636YPn9-EgbQ7XBl67Ua1e_MKQlw4xd6LPYg9iprAFy/exec';
/* URL /exec del despliegue en Apps Script */
var SHEETS_TOKEN = 'cosmiatras-2026';   /* el mismo que pusiste en Codigo.gs */

var enviando = false;

function pendientesEnvio(){
  return DB.registros.filter(function(r){ return r.fin && !r.enviado; });
}

function pintarEstadoEnvio(){
  var el = $('estadoEnvio');
  if(!el) return;
  if(!SHEETS_URL){ el.textContent = 'Hoja no conectada'; return; }
  var n = pendientesEnvio().length;
  el.textContent = n ? (n === 1 ? '1 sin enviar' : n + ' sin enviar') : 'Todo enviado';
}

/* Envia una lista de registros. "manual" = lo pidio la persona con
   el boton, asi que conviene avisarle de todo; si es automatico se
   avisa solo cuando hay algo que contar. */
function enviarLista(lista, manual){
  if(!SHEETS_URL){ if(manual) aviso('Falta conectar la hoja: no hay URL configurada'); return; }
  if(enviando){    if(manual) aviso('Ya hay un envio en curso, espera un momento'); return; }
  if(!lista.length){ if(manual) aviso('No hay procedimientos terminados para enviar'); return; }

  enviando = true;
  if(manual) aviso('Enviando ' + lista.length + '...');

  var cuerpo = {
    token: SHEETS_TOKEN,
    registros: lista.map(function(r){
      return {
        id: r.id, fecha: r.fecha, paciente: r.paciente, cosmiatra: r.cosmiatra,
        procedimiento: r.procedimiento, inicio: r.inicio, fin: r.fin
      };
    })
  };

  /* text/plain a proposito: evita la peticion previa (preflight)
     que Apps Script no sabe responder. */
  fetch(SHEETS_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body:    JSON.stringify(cuerpo)
  })
  .then(function(res){ return res.json(); })
  .then(function(res){
    if(!res.ok) throw new Error(res.error || 'la hoja respondio sin ok');
    (res.ids || []).forEach(function(id){
      var r = porId(id);
      if(r) r.enviado = true;
    });
    guardar();

    var repes = (res.repetidos || []).length;
    if(res.filas || manual){
      /* el detalle dice cuantas filas fueron a cada pestana */
      var partes = (res.detalle || []).map(function(d){ return d.filas + ' en ' + d.hoja; });
      var txt = 'Guardado: ' + (partes.length ? partes.join(' | ') : res.filas + ' filas');
      if(repes) txt += ' (' + repes + ' ya estaban)';
      aviso(txt);
    }
  })
  .catch(function(err){
    /* antes decia "sin conexion" pasara lo que pasara, y eso despista:
       aqui cae tanto quedarse sin internet como que la hoja conteste mal */
    var motivo;
    if(!navigator.onLine)                          motivo = 'sin internet';
    else if(err && /fetch|network|failed/i.test(String(err.message))) motivo = 'no se pudo conectar';
    else                                           motivo = String((err && err.message) || err);

    aviso('Queda pendiente (' + motivo + '). Se reintenta solo');
  })
  .then(function(){
    enviando = false;
    pintarEstadoEnvio();
  });
}

/* Envio automatico: solo lo terminado que aun no se mando. */
function enviarPendientes(){
  pintarEstadoEnvio();
  enviarLista(pendientesEnvio(), false);
}

/* Boton "Enviar a la hoja": manda lo que se ve en el reporte segun
   los filtros de fecha y cosmiatra. Si algo ya estaba en la hoja el
   script lo reconoce por su id y no lo duplica. */
function enviarFiltrados(){
  enviarLista(filtrados().filter(function(r){ return r.fin; }), true);
}

/* ---------- reintentos automaticos ----------
   En el telefono la conexion se va y vuelve, y el navegador congela la
   pagina cuando se bloquea la pantalla. Con esto lo pendiente se manda
   solo, sin que nadie tenga que acordarse. */

/* al recuperar la conexion */
window.addEventListener('online', function(){ enviarPendientes(); });

/* al volver a la app despues de bloquear el telefono o cambiar de pestaña */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) enviarPendientes();
});

/* y por si acaso, una vez por minuto mientras quede algo */
setInterval(function(){
  if(pendientesEnvio().length) enviarPendientes();
}, 60000);

/* Marca todo lo que hay ahora como ya enviado. Se usa UNA vez, al
   conectar la hoja por primera vez, para no duplicar lo que ya
   estaba en el Excel. Desde la consola:  yaEstabaEnElExcel()  */
function yaEstabaEnElExcel(){
  var n = 0;
  DB.registros.forEach(function(r){ if(!r.enviado){ r.enviado = true; n++; } });
  guardar();
  pintarEstadoEnvio();
  aviso(n + ' registros marcados como ya enviados');
  return n;
}

/* ---------- navegacion ---------- */
$('btnReporte').onclick = abrirReporte;

$('btnVolver').onclick = function(){
  /* del reporte de una persona se vuelve a su hoja, no a la lista */
  if(!$('p3').classList.contains('oculto') && reporteDe){
    reporteDe = null;
    pantalla(2);
    pintarHoja();
    pintarPendientes();
    return;
  }
  reporteDe  = null;
  cosmActual = null;
  pintarCosmiatras();
  pantalla(1);
};

pintarCosmiatras();
pantalla(1);
enviarPendientes();
</script>
